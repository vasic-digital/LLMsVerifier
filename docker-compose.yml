version: '3.8'

services:
  llm-verifier:
    build:
      context: .
      dockerfile: Dockerfile
    mem_limit: 4g
    memswap_limit: 4g
    pids_limit: 2048
    oom_score_adj: 500
    ports:
      - "8080:8080"
    environment:
      - LLM_DB_PATH=/app/data/llm-verifier.db
      - LLMSVERIFIER_PORT=8080
      - LLMSVERIFIER_API_KEY=${LLMSVERIFIER_API_KEY:-}
    volumes:
      - ./data:/app/data
      - ./exports:/app/exports
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    labels:
      - "digital.vasic.service=llmsverifier"
      - "digital.vasic.tier=core"
    networks:
      - llm-verifier-network

networks:
  llm-verifier-network:
    driver: bridge
