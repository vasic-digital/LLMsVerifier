version: '3.8'

# Messaging Infrastructure for LLMsVerifier
# RabbitMQ for task queues, Kafka for event streaming

services:
  # RabbitMQ - Task Queue Broker
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: llmsverifier-rabbitmq
    mem_limit: 2g
    memswap_limit: 2g
    pids_limit: 1024
    oom_score_adj: 500
    hostname: rabbitmq
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: llmsverifier
      RABBITMQ_DEFAULT_PASS: llmsverifier123
      RABBITMQ_DEFAULT_VHOST: llmsverifier
      RABBITMQ_ERLANG_COOKIE: llmsverifier-secret-cookie
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - rabbitmq_logs:/var/log/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - messaging-network
    labels:
      - "com.llmsverifier.service=rabbitmq"
      - "com.llmsverifier.description=Task Queue Broker"

  # Zookeeper - Kafka Coordination
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: llmsverifier-zookeeper
    mem_limit: 1g
    memswap_limit: 1g
    pids_limit: 1024
    oom_score_adj: 500
    hostname: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_SYNC_LIMIT: 2
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log
    healthcheck:
      test: nc -z localhost 2181 || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - messaging-network
    labels:
      - "com.llmsverifier.service=zookeeper"
      - "com.llmsverifier.description=Kafka Coordination"

  # Kafka - Event Stream Broker
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: llmsverifier-kafka
    mem_limit: 3g
    memswap_limit: 3g
    pids_limit: 2048
    oom_score_adj: 500
    hostname: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"     # External clients
      - "29092:29092"   # Internal Docker network
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_BYTES: 1073741824
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_JMX_PORT: 9999
      KAFKA_JMX_HOSTNAME: kafka
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: kafka-topics --bootstrap-server localhost:9092 --list || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - messaging-network
    labels:
      - "com.llmsverifier.service=kafka"
      - "com.llmsverifier.description=Event Stream Broker"

  # Schema Registry - Avro Schema Management
  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.0
    container_name: llmsverifier-schema-registry
    mem_limit: 2g
    memswap_limit: 2g
    pids_limit: 1024
    oom_score_adj: 500
    hostname: schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_DEBUG: "true"
    healthcheck:
      test: curl -f http://localhost:8081/subjects || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - messaging-network
    labels:
      - "com.llmsverifier.service=schema-registry"
      - "com.llmsverifier.description=Avro Schema Registry"

  # Kafka UI - Management Interface
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: llmsverifier-kafka-ui
    mem_limit: 3g
    memswap_limit: 3g
    pids_limit: 2048
    oom_score_adj: 500
    hostname: kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    ports:
      - "8082:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: llmsverifier
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      KAFKA_CLUSTERS_0_METRICS_PORT: 9999
      DYNAMIC_CONFIG_ENABLED: "true"
    restart: unless-stopped
    networks:
      - messaging-network
    labels:
      - "com.llmsverifier.service=kafka-ui"
      - "com.llmsverifier.description=Kafka Management UI"

  # Topic Initialization Service
  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: llmsverifier-kafka-init
    mem_limit: 3g
    memswap_limit: 3g
    pids_limit: 2048
    oom_score_adj: 500
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "
      echo 'Creating Kafka topics...'

      # Event topics
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic llmsverifier.events.verification --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic llmsverifier.events.provider --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic llmsverifier.events.model --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic llmsverifier.events.audit --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic llmsverifier.events.metrics --partitions 3 --replication-factor 1

      # Dead letter topics
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic llmsverifier.dlq --partitions 1 --replication-factor 1

      echo 'Kafka topics created successfully!'
      kafka-topics --bootstrap-server kafka:29092 --list
      "
    networks:
      - messaging-network
    labels:
      - "com.llmsverifier.service=kafka-init"
      - "com.llmsverifier.description=Topic Initialization"

networks:
  messaging-network:
    driver: bridge
    name: llmsverifier-messaging

volumes:
  rabbitmq_data:
    name: llmsverifier-rabbitmq-data
  rabbitmq_logs:
    name: llmsverifier-rabbitmq-logs
  zookeeper_data:
    name: llmsverifier-zookeeper-data
  zookeeper_logs:
    name: llmsverifier-zookeeper-logs
  kafka_data:
    name: llmsverifier-kafka-data
